source /boot/grub/config.cfg

# COLDIRON verified boot — the kernel and initramfs are signed with the
# build boot key (keys/boot/); GRUB verifies them before loading and
# refuses to boot unverified files. See keys/boot/README.md for the
# security model: the trust anchor is the release signature
# (SHA256SUMS.asc) you verify before writing the USB.
#
# NOTE: the kernel name below is pinned (build.sh KERNEL_VERSION); the
# binary hook asserts every kernel referenced here actually got signed.
#
# Debian's grub ships the signature-verification commands (trust,
# verify_detached) in the `pgp` module (upstream calls it `verify`).
# verify_detached takes FILE then SIGNATURE_FILE (file FIRST).
# The .sig names are VERSIONED (the 0100 binary hook signs the versioned
# /live files); the unversioned /live/vmlinuz symlink has no signature.
set timeout=10
# Load the boot-critical modules BEFORE check_signatures=enforce: with
# enforcement on, GRUB refuses to load ANY file without a valid .sig —
# including its own lazily-loaded modules (linux.mod, initrd.mod load when
# the menuentry runs). Preloading them here avoids requiring module sigs.
insmod pgp
insmod sleep
insmod reboot
insmod linux
insmod initrd
trust /live/coldiron.pub

if ! verify_detached /live/vmlinuz-6.12.101-coldiron /live/vmlinuz-6.12.101-coldiron.sig; then
	echo "COLDIRON: kernel signature verification FAILED — refusing to boot."
	sleep 30
	reboot
fi
if ! verify_detached /live/initrd.img-6.12.101-coldiron /live/initrd.img-6.12.101-coldiron.sig; then
	echo "COLDIRON: initramfs signature verification FAILED — refusing to boot."
	sleep 30
	reboot
fi

# from here on, every file GRUB loads must carry a valid signature
# (the linux/initrd files below are verified via their .sig siblings)
set check_signatures=enforce

@LINUX_LIVE@
