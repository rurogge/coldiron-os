source /boot/grub/config.cfg

# COLDIRON verified boot — the kernel and initramfs are signed with the
# build boot key (keys/boot/); GRUB verifies them before loading and
# refuses to boot unverified files. See keys/boot/README.md for the
# security model: the trust anchor is the release signature
# (SHA256SUMS.asc) you verify before writing the USB.
#
# NOTE: the kernel name below is pinned (build.sh KERNEL_VERSION); the
# binary hook asserts every kernel referenced here actually got signed.
insmod verify
insmod sleep
insmod reboot
trust /live/coldiron.pub
set check_signatures=enforce

if ! verify_detached /live/vmlinuz.sig /live/vmlinuz-6.12.101-coldiron; then
	echo "COLDIRON: kernel signature verification FAILED — refusing to boot."
	sleep 30
	reboot
fi
if ! verify_detached /live/initrd.img.sig /live/initrd.img-6.12.101-coldiron; then
	echo "COLDIRON: initramfs signature verification FAILED — refusing to boot."
	sleep 30
	reboot
fi

@LINUX_LIVE@
