# COLDIRON OS — kernel hardening sysctls
#
# NOTE: the v0.3 networkless kernel compiles out IPv6 (CONFIG_IPV6=n) and
# kexec (CONFIG_KEXEC=n) entirely — the old net.ipv6.* and
# kernel.kexec_load_disabled=1 entries only existed as belt+braces on the
# stock kernel and are gone because the sysctls no longer exist.

# ---- kernel info disclosure ----
kernel.kptr_restrict=2
kernel.dmesg_restrict=1
kernel.printk=3 3 3 3
kernel.yama.ptrace_scope=2

# ---- no core dumps, no crash dumps ----
kernel.core_pattern=/dev/null
fs.suid_dumpable=0

# ---- BPF hardening ----
kernel.unprivileged_bpf_disabled=1
net.core.bpf_jit_harden=2

# ---- network: nothing forwards, nothing routes (loopback-only stack) ----
net.ipv4.conf.all.forwarding=0
net.ipv4.conf.default.forwarding=0
net.ipv4.conf.all.rp_filter=1
net.ipv4.conf.default.rp_filter=1
net.ipv4.icmp_echo_ignore_broadcasts=1
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.all.send_redirects=0

# ---- misc ----
dev.tty.ldisc_autoload=0
kernel.sysrq=0
