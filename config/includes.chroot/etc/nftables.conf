# COLDIRON OS — default-deny packet policy (loaded by nftables.service).
#
# With the v0.3 networkless kernel there is NO netfilter subsystem at all
# (CONFIG_NETFILTER=n), so this ruleset can never apply — the service unit
# carries ConditionPathExists=/proc/net/netfilter and simply does not run.
# On transitional builds with the stock kernel, this policy makes the
# loopback-only system also packet-deny by default: nothing in, nothing
# out, nothing forwarded.
#
#!/usr/sbin/nft -f

flush ruleset

table inet coldiron {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy drop;
    oif "lo" accept
  }
}
